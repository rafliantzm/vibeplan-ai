<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>VibePlan AI · UTS Deck</title>
<script>
  window.DECK_MANIFEST = [
    { file: "slides/01-cover.html", label: "Cover" },
    { file: "slides/02-tim.html", label: "Identitas Tim" },
    { file: "slides/03-latar-belakang.html", label: "Latar Belakang" },
    { file: "slides/04-problem-statement.html", label: "Problem Statement" },
    { file: "slides/05-solusi.html", label: "Solusi" },
    { file: "slides/06-target-user.html", label: "Target User" },
    { file: "slides/07-requirement-uts.html", label: "Requirement UTS" },
    { file: "slides/08-tech-stack.html", label: "Tech Stack" },
    { file: "slides/09-arsitektur.html", label: "Arsitektur Sistem" },
    { file: "slides/10-alur-kerja.html", label: "Alur Kerja Aplikasi" },
    { file: "slides/11-prd-generator.html", label: "PRD Generator" },
    { file: "slides/12-next-step-planner.html", label: "Next Step Planner" },
    { file: "slides/13-coding-prompt-generator.html", label: "Coding Prompt Generator" },
    { file: "slides/14-fitur-pendukung.html", label: "Fitur Pendukung" },
    { file: "slides/15-fitur-admin.html", label: "Fitur Admin" },
    { file: "slides/16-demo-scenario.html", label: "Demo Scenario" },
    { file: "slides/17-testing-deployment.html", label: "Testing & Deployment" },
    { file: "slides/18-kesimpulan.html", label: "Kesimpulan" }
  ];
  window.DECK_WIDTH = 1280;
  window.DECK_HEIGHT = 720;
</script>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body {
    width: 100vw;
    height: 100vh;
    overflow: hidden;
    background: radial-gradient(circle at top right, rgba(78, 92, 255, 0.28), transparent 28%),
                radial-gradient(circle at bottom left, rgba(0, 212, 255, 0.16), transparent 24%),
                linear-gradient(180deg, #061020 0%, #0a1529 55%, #081222 100%);
    font-family: "Segoe UI", Inter, Arial, sans-serif;
  }
  body {
    display: grid;
    place-items: center;
    position: relative;
  }
  #deck-shell {
    position: fixed;
    inset: 0;
    width: 100vw;
    height: 100vh;
    display: grid;
    place-items: center;
    overflow: hidden;
    padding: 24px 24px 52px;
  }
  #stage {
    position: relative;
    width: min(1180px, 92vw);
    aspect-ratio: 16 / 9;
    max-height: calc(100vh - 84px);
    overflow: hidden;
    border-radius: 28px;
    box-shadow: 0 30px 100px rgba(0, 0, 0, 0.34);
    background: rgba(255, 255, 255, 0.05);
    border: 1px solid rgba(255, 255, 255, 0.08);
    backdrop-filter: blur(18px);
  }
  iframe {
    width: 100%;
    height: 100%;
    border: 0;
    display: block;
    opacity: 0;
    transition: opacity 360ms ease;
    background: #071120;
  }
  iframe.ready {
    opacity: 1;
  }
  .glow {
    position: fixed;
    border-radius: 999px;
    filter: blur(42px);
    opacity: 0.34;
    animation: drift 12s ease-in-out infinite;
    pointer-events: none;
  }
  .glow.one {
    top: 4%;
    right: 4%;
    width: 280px;
    height: 280px;
    background: rgba(91, 101, 255, 0.45);
  }
  .glow.two {
    bottom: 8%;
    left: 6%;
    width: 320px;
    height: 320px;
    background: rgba(33, 198, 255, 0.24);
    animation-delay: -4s;
  }
  .glow.three {
    top: 45%;
    left: 20%;
    width: 200px;
    height: 200px;
    background: rgba(173, 106, 255, 0.18);
    animation-delay: -8s;
  }
  @keyframes drift {
    0%, 100% { transform: translate3d(0, 0, 0) scale(1); }
    50% { transform: translate3d(18px, -14px, 0) scale(1.08); }
  }
  .counter {
    position: fixed;
    bottom: 14px;
    right: 22px;
    padding: 6px 11px;
    border-radius: 999px;
    background: rgba(7, 17, 32, 0.72);
    border: 1px solid rgba(255, 255, 255, 0.08);
    color: #f4f8ff;
    font-size: 11px;
    z-index: 10;
    backdrop-filter: blur(18px);
    user-select: none;
  }
  .counter .label {
    color: rgba(255, 255, 255, 0.72);
    margin-left: 8px;
  }
  .progress-wrap {
    position: fixed;
    left: 22px;
    right: 22px;
    bottom: 10px;
    height: 4px;
    border-radius: 999px;
    background: rgba(255, 255, 255, 0.08);
    overflow: hidden;
    z-index: 11;
    pointer-events: none;
  }
  .progress-bar {
    height: 100%;
    width: 0;
    border-radius: 999px;
    background: linear-gradient(90deg, #5c7cff 0%, #22c6ff 100%);
    transition: width 340ms ease;
  }
  .nav-zone {
    position: fixed;
    top: 0;
    bottom: 0;
    width: min(8vw, 88px);
    z-index: 8;
  }
  .nav-zone.left { left: 0; }
  .nav-zone.right { right: 0; }
  .nav-hint {
    position: absolute;
    top: 50%;
    transform: translateY(-50%);
    width: 48px;
    height: 48px;
    display: flex;
    align-items: center;
    justify-content: center;
    border-radius: 999px;
    background: rgba(8, 18, 34, 0.58);
    color: rgba(255, 255, 255, 0.66);
    border: 1px solid rgba(255, 255, 255, 0.08);
    font-size: 24px;
    opacity: 0;
    transition: opacity 220ms ease;
    user-select: none;
    backdrop-filter: blur(14px);
  }
  .nav-zone.left .nav-hint { left: 20px; }
  .nav-zone.right .nav-hint { right: 20px; }
  .nav-zone:hover .nav-hint { opacity: 1; }
  @media (max-width: 960px) {
    #stage {
      width: min(96vw, 1600px);
      max-height: calc(100vh - 72px);
      border-radius: 20px;
    }
    .counter {
      right: 14px;
      bottom: 12px;
      font-size: 12px;
      padding: 7px 12px;
    }
    .progress-wrap {
      left: 14px;
      right: 14px;
      bottom: 8px;
    }
    .nav-zone {
      width: 56px;
    }
    .nav-zone.left .nav-hint { left: 10px; }
    .nav-zone.right .nav-hint { right: 10px; }
  }
</style>
</head>
<body>
  <div class="glow one"></div>
  <div class="glow two"></div>
  <div class="glow three"></div>

  <div id="deck-shell">
    <div id="stage">
      <iframe id="frame" src="about:blank" title="VibePlan AI UTS Deck"></iframe>
    </div>
  </div>

  <div class="nav-zone left" id="nav-left"><div class="nav-hint">‹</div></div>
  <div class="nav-zone right" id="nav-right"><div class="nav-hint">›</div></div>
  <div class="progress-wrap"><div class="progress-bar" id="progress-bar"></div></div>
  <div class="counter" id="counter">1 / 18 <span class="label">Cover</span></div>

<script>
(function () {
  const deck = window.DECK_MANIFEST || [];
  const W = window.DECK_WIDTH || 1280;
  const H = window.DECK_HEIGHT || 720;
  const stage = document.getElementById("stage");
  const frame = document.getElementById("frame");
  const counter = document.getElementById("counter");
  const progress = document.getElementById("progress-bar");
  const storageKey = "vibeplan-uts-deck";
  let current = 0;

  function fit() {
    const maxWidth = Math.min(window.innerWidth * 0.92, 1600);
    const maxHeight = window.innerHeight * 0.88;
    const width = Math.min(maxWidth, maxHeight * (W / H));
    const height = width / (W / H);
    stage.style.width = `${width}px`;
    stage.style.height = `${height}px`;
  }

  function renderMeta() {
    const item = deck[current] || {};
    counter.innerHTML = `${current + 1} / ${deck.length} <span class="label">${item.label || ""}</span>`;
    progress.style.width = `${((current + 1) / deck.length) * 100}%`;
    history.replaceState(null, "", `#${current + 1}`);
    localStorage.setItem(storageKey, String(current));
  }

  function show(index) {
    if (index < 0 || index >= deck.length) return;
    current = index;
    frame.classList.remove("ready");
    frame.src = deck[index].file;
    renderMeta();
  }

  function next() { show(Math.min(current + 1, deck.length - 1)); }
  function prev() { show(Math.max(current - 1, 0)); }

  frame.addEventListener("load", () => {
    requestAnimationFrame(() => frame.classList.add("ready"));
  });

  document.getElementById("nav-left").addEventListener("click", prev);
  document.getElementById("nav-right").addEventListener("click", next);
  window.addEventListener("resize", fit);

  document.addEventListener("keydown", (event) => {
    if (["ArrowRight", "PageDown", " "].includes(event.key)) {
      event.preventDefault();
      next();
    } else if (["ArrowLeft", "PageUp"].includes(event.key)) {
      event.preventDefault();
      prev();
    } else if (event.key === "Home") {
      event.preventDefault();
      show(0);
    } else if (event.key === "End") {
      event.preventDefault();
      show(deck.length - 1);
    }
  });

  const hashMatch = window.location.hash.match(/^#(\d+)$/);
  if (hashMatch) {
    current = Math.min(Math.max(parseInt(hashMatch[1], 10) - 1, 0), deck.length - 1);
  } else {
    const saved = parseInt(localStorage.getItem(storageKey), 10);
    if (!Number.isNaN(saved) && saved >= 0 && saved < deck.length) {
      current = saved;
    }
  }

  fit();
  show(current);
})();
</script>
</body>
</html>
